name: Deploy to Production

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run idempotent database seeders (db:seed --force)"
        required: false
        default: "false"
        type: boolean
      sync_env:
        description: "Write/update server .env credentials from GitHub Secrets"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: production-lmsout
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to lmsout.wolinet.com
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Verify required SSH secrets are configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required GitHub Secret '$var' is not set." >&2
              echo "Configure SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, and DEPLOY_PATH in Settings -> Secrets -> Actions." >&2
              exit 1
            fi
          done

      - name: Deploy over SSH via deploy/deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_URL: ${{ vars.APP_URL || 'https://lmsout.wolinet.com' }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST || '127.0.0.1' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
          PESAPAL_IPN_ID: ${{ secrets.PESAPAL_IPN_ID }}
          PESAPAL_MODE: ${{ vars.PESAPAL_MODE || 'sandbox' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_URL,DB_CONNECTION,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD,PESAPAL_CONSUMER_KEY,PESAPAL_CONSUMER_SECRET,PESAPAL_IPN_ID,PESAPAL_MODE
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            FLAGS="--branch=main"
            if [ "${{ inputs.run_seed || vars.RUN_SEED || 'false' }}" = "true" ]; then
              FLAGS="${FLAGS} --seed"
            fi
            if [ "${{ inputs.sync_env || vars.SYNC_ENV || 'false' }}" = "true" ]; then
              FLAGS="${FLAGS} --sync-env"
            fi
            bash deploy/deploy.sh ${FLAGS}
