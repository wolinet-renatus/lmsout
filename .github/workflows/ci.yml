name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, Build Assets, Migrate/Seed & Test (PHP 8.3 + MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: lmsout_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite3, pdo_sqlite, gd, zip, bcmath, curl, intl, xml
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: CACHE_STORE=array composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Install npm dependencies and build Vite assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: PHP syntax lint across application code
        run: |
          find app config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Prepare CI environment file
        run: |
          cp .env.example .env
          CACHE_STORE=array php artisan key:generate --force
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^# *DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^# *DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^# *DB_DATABASE=.*/DB_DATABASE=lmsout_ci/' .env
          sed -i 's/^# *DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^# *DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Verify fresh MySQL migrations and database seeding
        run: |
          CACHE_STORE=array php artisan migrate --force --no-interaction
          php artisan package:discover --ansi --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan storage:link --relative --force
          php artisan view:cache

      - name: Run Feature test suites
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lmsout_ci
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan test \
            tests/Feature/CampusUnifiedWorkflowTest.php \
            tests/Feature/ScmsFullParityAndRbacTest.php \
            tests/Feature/CurrencyExchangeSwitchTest.php \
            tests/Feature/PesapalIntegrationTest.php \
            tests/Feature/StudentCourseAccessTest.php
